name: Build Serduszka mod
on:
  push:
    branches: [mod-serduszka]
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build
        run: |
          set +e
          gradle build --no-daemon --stacktrace > build.log 2>&1
          echo $? > status.txt
          true
      - name: Publish result to branch
        run: |
          rm -rf dist && mkdir -p dist
          cp status.txt dist/status.txt
          tail -n 400 build.log > dist/build-log.txt
          if [ "$(cat status.txt)" = "0" ]; then
            find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "Build result (status $(cat status.txt)) [skip ci]" || echo "nothing to commit"
          git push
